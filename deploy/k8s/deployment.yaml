apiVersion: apps/v1
kind: Deployment
metadata:
  name: widget-demo
  namespace: ns-gc40gxwh
spec:
  replicas: 1
  selector:
    matchLabels:
      app: widget-demo
  template:
    metadata:
      labels:
        app: widget-demo
    spec:
      automountServiceAccountToken: false
      initContainers:
        - name: migrate
          image: ghcr.io/wincax88/widget-demo:replace-with-git-sha
          command: ["npx", "prisma", "migrate", "deploy", "--schema", "/app/prisma/schema.prisma"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef: { name: widget-demo, key: DATABASE_URL }
      containers:
        - name: widget-demo
          image: ghcr.io/wincax88/widget-demo:replace-with-git-sha
          imagePullPolicy: IfNotPresent
          ports:
            - { name: http, containerPort: 8080 }
          envFrom:
            - configMapRef: { name: widget-demo }
            - secretRef: { name: widget-demo }
          readinessProbe:
            httpGet: { path: /api/health/ready, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /api/health/live, port: http }
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests: { cpu: 100m, memory: 192Mi }
            limits: { cpu: 1000m, memory: 512Mi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
      securityContext:
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
